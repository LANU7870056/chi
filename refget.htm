    body {

      padding: 20px;

    .home-icon {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 480px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;

    .result-box {
      background: #eef2f7;

      border-radius: 4px;
      font-family: monospace;

      margin: 10px 0;
    }

    button {
      padding: 8px 16px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0052a3;
    }

    #tim {
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      min-height: 30px;
    }

    .loading-dots {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
    }

    .loading-dots span {
      width: 10px;
      height: 10px;
      background-color: #3498db;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { 
        transform: scale(0);
      } 
      40% { 
        transform: scale(1.0);
      }
    }

    /* 表格樣式 */
    table {
      width: 100%;
      max-width: 480px;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background-color: #0066cc;
      color: white;
    }
  </style>
