<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣股票/ETF股利殖利率查詢</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          }
        }
      }
    }
  </script>

<style>
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #580000;
    display: flex;
    justify-content: center;
}

.card {
    background-color: #ffffff;
    border-radius: 14px;
    padding: 2px;
    width: 98%;
    max-width: 800px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.table-container {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background-color: #fff;
    box-shadow: 0 2px 2px rgba(0,0,0,0.1);
    border-radius: 2px;
    margin-top: 2px;
}

table {
    width: 100%;
    min-width: 300px;
    border-collapse: collapse;
    background-color: #fff;
    white-space: nowrap;
}

td {
    padding: 1px 1px;
    text-align: center;
    border-bottom: 1px solid #dee2e6;
    font-size: 15px;
}

th {
    background-color: #007bff;
    padding: 2px 1px;
    color: white;
    position: sticky;
    top: 0;
    z-index: 1;
}

.header-bar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    min-height: 50px;
    padding: 0 8px;
}

.home-link {
    display: flex;
    align-items: center;
}

.home-icon {
    height: 40px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
}

.home-icon:hover {
    transform: scale(1.1);
    opacity: 0.85;
}

.header-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    color: #00F;
    margin: 0;
    font-weight: 700;
}

.header-spacer {
    width: 40px; 
}
</style>
</head>
<body>
<div class="card">
  <!-- 頂部標題區域 -->
  <div class="card-header relative flex items-center p-3">
    <!-- 左側按鈕區塊 -->
    <div class="flex items-center gap-2 z-10">
        <a href="index.htm" title="回首頁">
            <img src="home.png" alt="Home" class="header-icon w-12 h-12">
        </a>
        <a href="da5.htm" title="上一頁">
            <img src="back.png" alt="Back" class="header-icon w-12 h-12">
        </a>
    </div>

    <!-- 中間標題 -->
    <span class="absolute left-1/2 -translate-x-1/2 text-lg font-bold text-gray-800">
        股利收入
    </span>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-1 sm:px-1 lg:px-1 py-1 space-y-6">

      <!-- 第一個表格：已發放股利紀錄 (inc > 0) -->
      <div>
        <h2 class="text-base font-bold text-gray-700 mb-2 border-l-4 border-blue-600 pl-2">已入帳股利紀錄</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-[16px] sm:text-[18px] whitespace-nowrap">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-200 font-semibold">
                <th style="font-size: 16px;" class="py-1 px-1 text-left responsive-th">股號</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th">名稱</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th">除息日</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th">發放日</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th">股利</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-right responsive-th">股利收入</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-200/50">
              <!-- Dynamic rows -->
            </tbody>
          </table>
        </div>

        <!-- Empty State 1 -->
        <div id="emptyState" class="hidden py-8 text-center text-slate-500">
          <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-300"></i>
          <p class="text-sm font-medium">沒有符合條件的數據資料</p>
        </div>
      </div>

      <!-- 第二個表格：今年除息且本月發放預告 -->
      <div class="pt-2">
        <h2 class="text-base font-bold text-gray-700 mb-2 border-l-4 border-emerald-600 pl-2">本月預計發放股利 (今年除息)</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-[16px] sm:text-[18px] whitespace-nowrap">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-200 font-semibold">
                <th style="font-size: 16px;" class="py-1 px-1 text-left responsive-th !bg-emerald-600">股號</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th !bg-emerald-600">名稱</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th !bg-emerald-600">除息日</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th !bg-emerald-600">發放日</th>
                <th style="font-size: 16px;" class="py-1 px-1 text-center responsive-th !bg-emerald-600">股利</th>

              </tr>
            </thead>
            <tbody id="tableBodyUpcoming" class="divide-y divide-slate-200/50">
              <!-- Dynamic rows -->
            </tbody>
          </table>
        </div>

        <!-- Empty State 2 -->
        <div id="emptyStateUpcoming" class="hidden py-8 text-center text-slate-500">
          <i class="fa-solid fa-calendar-xmark text-3xl mb-2 text-slate-300"></i>
          <p class="text-sm font-medium">本月無預計發放的股利資料</p>
        </div>
      </div>

  </main>
</div>

  <!-- Include external JS file as required -->
  <script src="da5.js"></script>

  <!-- Application Script -->
  <script>
    const fallbackData = [
      {sid:"0052", na:"富邦台灣科技", inc:"", ra:"1.199", da1:"115/04/20", da2:"11/15", price:"50.05", DJ:"50.05", rate:"0.024"},
      {sid:"0052", na:"富邦台灣科技", inc:"153", ra:"3.23", da1:"114/05/10", da2:"114/06/01", price:"21.86", DJ:"21.86", rate:"0.085"}
    ];

    let dataSource = [];
    let upcomingSource = [];

    document.addEventListener('DOMContentLoaded', () => {
      let rawData = [];
      if (typeof da5 !== 'undefined' && Array.isArray(da5) && da5.length > 0) {
        rawData = da5;
      } else {
        rawData = fallbackData;
      }

      // 取得今年民國年份 (2026 - 1911 = 115) 及當前月份
      const now = new Date();
      const currentMinguoYear = now.getFullYear() - 1911; // 115
      const currentMonth = now.getMonth() + 1; // 1 ~ 12

      // 1. 原表格篩選：inc > 0
      dataSource = rawData.filter(item => {
        const incVal = parseFloat(item.inc);
        return !isNaN(incVal) && incVal > 0;
      });
      dataSource.sort((a, b) => a.sid.localeCompare(b.sid, 'zh-TW', { numeric: true }));

      // 2. 新表格篩選：da1年度為今年 (115), da2月份為本月份, inc為空字串或未填
      upcomingSource = rawData.filter(item => {
        const da1Obj = parseDate(item.da1);
        const da2Obj = parseDate(item.da2);

        // 檢查 inc 是否為空或 0
        const rawInc = item.inc;
        const isIncEmpty = (rawInc === undefined || rawInc === null || String(rawInc).trim() === "" || parseFloat(rawInc) === 0);
        
        // 檢查 da1 的民國年份是否為當前年份 (115)
        const isDa1ThisYear = (da1Obj.minguoYear === currentMinguoYear);
        // 檢查 da2 的月份是否為本月份
        const isDa2ThisMonth = (da2Obj.month === currentMonth);

        return isDa1ThisYear && isDa2ThisMonth && isIncEmpty;
      });
      upcomingSource.sort((a, b) => a.sid.localeCompare(b.sid, 'zh-TW', { numeric: true }));

      renderData();
      renderUpcomingData();
    });

    // 支援解析民國日期格式 (如 "115/04/20" 或 "11/15") 以及 Excel 數字序列號
    function parseDate(dateStr) {
      if (!dateStr) return { formatted: '--', minguoYear: null, month: null };
      
      const str = String(dateStr).trim();

      // 情況 A：如果包含斜線 (如 "115/04/20" 或 "11/15")
      if (str.includes('/')) {
        const parts = str.split('/');
        if (parts.length === 3) {
          // 格式：YYY/MM/DD
          const yyyy = parseInt(parts[0], 10);
          const mm = parseInt(parts[1], 10);
          const dd = parseInt(parts[2], 10);
          return {
            formatted: `${yyyy + 1911}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`,
            minguoYear: yyyy,
            month: mm
          };
        } else if (parts.length === 2) {
          // 格式：MM/DD (可能沒有年份，預設採用當前年份)
          const mm = parseInt(parts[0], 10);
          const dd = parseInt(parts[1], 10);
          const currentMinguoYear = new Date().getFullYear() - 1911;
          return {
            formatted: `${mm}/${dd}`,
            minguoYear: currentMinguoYear,
            month: mm
          };
        }
      }

      // 情況 B：如果為 Excel 數字序列號
      const serial = Number(str);
      if (!isNaN(serial) && serial > 0) {
        const jsDate = new Date((serial - 25569) * 86400 * 1000);
        if (!isNaN(jsDate.getTime())) {
          const yyyy = jsDate.getUTCFullYear();
          const minguoYear = yyyy - 1911;
          const mmNum = jsDate.getUTCMonth() + 1;
          const mm = String(mmNum).padStart(2, '0');
          const dd = String(jsDate.getUTCDate()).padStart(2, '0');
          return {
            formatted: `${yyyy}-${mm}-${dd}`,
            minguoYear: minguoYear,
            month: mmNum
          };
        }
      }

      return { formatted: str, minguoYear: null, month: null };
    }

    function formatNumber(val) {
      const num = parseFloat(val);
      if (isNaN(num)) return val || '--';
      return num.toLocaleString('zh-TW');
    }

    // 渲染第一張表格 (已發放)
    function renderData() {
      const tBody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');

      tBody.innerHTML = '';

      if (dataSource.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      dataSource.forEach((item, index) => {
        const da1Date = parseDate(item.da1);
        const da2Date = parseDate(item.da2);

        const formattedRa = formatNumber(item.ra);
        const formattedInc = formatNumber(item.inc);

        const isOddRow = (index % 2 === 0);
        const rowBgClass = isOddRow ? 'bg-[#fef9c3] hover:bg-yellow-200/80' : 'bg-[#e0f2fe] hover:bg-sky-200/80';




const noo = item.no ? `-${item.no}張` : "";

        const tr = document.createElement('tr');
        tr.className = `${rowBgClass} transition-colors border-b border-slate-200/60`;
        tr.innerHTML = `
          <td style="font-size: 12px; color: #1d4ed8; padding: 4px;" class="text-left pl-3 font-semibold text-slate-900">${item.sid}</td>
          <td style="font-size: 12px; color: #1d4ed8; padding: 4px;" class="text-center font-semibold text-slate-900">${item.na}
<span style="color: #F00;">${noo}</span></td>
          <td style="font-size: 14px; color: #1d4ed8; padding: 4px;" class="text-center">${da1Date.formatted}</td>
          <td style="font-size: 14px; color: #1d4ed8; padding: 4px;" class="text-center">${da2Date.formatted}</td>
          <td style="font-size: 14px; color: #1d4ed8; padding: 4px;" class="text-center">${formattedRa}</td>
          <td style="font-size: 14px; color: #1d4ed8; padding: 4px;" class="text-right pr-3 font-semibold">${formattedInc}</td>
        `;
        tBody.appendChild(tr);
      });
    }

    // 渲染第二張表格 (今年除息、本月發放且未入帳)
    function renderUpcomingData() {
      const tBody = document.getElementById('tableBodyUpcoming');
      const emptyState = document.getElementById('emptyStateUpcoming');

      tBody.innerHTML = '';

      if (upcomingSource.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      upcomingSource.forEach((item, index) => {
        const da1Date = parseDate(item.da1);
        const da2Date = parseDate(item.da2);

        const formattedRa = formatNumber(item.ra);
        const formattedInc = '--';

        const isOddRow = (index % 2 === 0);
        const rowBgClass = isOddRow ? 'bg-[#f0fdf4] hover:bg-emerald-100/80' : 'bg-[#f0f9ff] hover:bg-sky-100/80';

        const tr = document.createElement('tr');
        tr.className = `${rowBgClass} transition-colors border-b border-slate-200/60`;
        tr.innerHTML = `
          <td style="font-size: 14px; color: #047857; padding: 4px;" class="text-left pl-3 font-semibold">${item.sid}</td>
          <td style="font-size: 14px; color: #047857; padding: 4px;" class="text-center font-semibold">${item.na}</td>
          <td style="font-size: 14px; color: #047857; padding: 4px;" class="text-center">${da1Date.formatted}</td>
          <td style="font-size: 14px; color: #047857; padding: 4px;" class="text-center">${da2Date.formatted}</td>
          <td style="font-size: 14px; color: #047857; padding: 4px;" class="text-center">${formattedRa}</td>

        `;
        tBody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
