<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時股票看板 (股價存入 pr2 Cookie)</title>

    <!-- 1. 引入 jQuery 與 Fancybox 燈箱套件 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-status {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
            font-size: 12px;
            color: #888;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #26a69a;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* 強制無論電腦或手機螢幕皆為一列 3 欄 */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 6px;
            width: 100%;
            max-width: 1200px;
        }

        /* 卡片超連結樣式重置 */
        .stock-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* 股票卡片樣式 */
        .stock-card {
            background-color: #000000;
            border: 1.5px solid #d32f2f;
            border-radius: 3px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background-color 0.3s ease, border-color 0.2s;
            cursor: pointer;
        }

        .stock-card-link:hover .stock-card {
            border-color: #ff5252;
            background-color: #121212;
        }

        /* 股票抬頭 (名稱 + 代號) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d32f2f;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .stock-name {
            font-size: clamp(11px, 2.5vw, 16px);
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stock-symbol {
            font-size: clamp(10px, 2.2vw, 14px);
            font-weight: 400;
            color: #d1d4dc;
            margin-left: 2px;
            flex-shrink: 0;
        }

        /* 股價區塊 */
        .card-body {
            text-align: center;
            padding: 2px 0;
        }

        .current-price {
            font-size: clamp(18px, 4.5vw, 36px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        /* 漲跌金額與幅度 */
        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(10px, 2.3vw, 18px);
            font-weight: 600;
            gap: 2px;
            white-space: nowrap;
        }

        /* 顏色控制（台灣標準：上漲紅、下跌綠） */
        .up {
            color: #ff3b30;
        }

        .down {
            color: #00e676;
        }

        .flat {
            color: #b2b5be;
        }

        /* 閃爍更新效果 */
        .flash-up {
            background-color: rgba(255, 59, 48, 0.25) !important;
        }

        .flash-down {
            background-color: rgba(0, 230, 118, 0.25) !important;
        }
    </style>
</head>
<body>

    <div class="header-status">
        <div><span class="status-dot"></span>即時報價連線中 (PR2 Cookie 儲存)</div>
        <div id="last-update">最後更新: --:--:--</div>
    </div>

    <div class="stock-grid" id="stockContainer"></div>

    <script>
        const s = "2002,2317,2330,2354,2610,4906,6182,6770,6781,0050,0052,00896,00919,00929,00939,00961";

        const stockNameMap = {
            "2002": "中鋼", "2317": "鴻海", "2330": "台積電", "2354": "英業達",
            "2610": "華航", "4906": "正文", "6182": "合晶", "6770": "力積電",
            "6781": "AES-KY", "0050": "元大台灣50", "0052": "富邦科技", 
            "00896": "中信綠能及電動車", "00919": "群益台灣精選高息", "00929": "復華台灣科技優息", 
            "00939": "統一台灣高息動能", "00961": "FT臺灣永續高息"
        };

        const otcList = ["6182"];
        const stockList = s.split(',');
        const stockData = {};

        // 讀取 Cookie 輔助函式 (用來解析儲存的 pr2)
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) {
                    try {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        }

        function initCards() {
            const container = document.getElementById('stockContainer');
            container.innerHTML = '';

            // 嘗試讀取之前的 pr2 Cookie 進行快速初始化
            let cachedPrices = [];
            const savedPr2 = getCookie("pr2");
            if (savedPr2) {
                cachedPrices = savedPr2.split(',');
            }

            stockList.forEach((code, index) => {
                const name = stockNameMap[code] || `股票 ${code}`;
                
                let initialPriceVal = 0;
                if (cachedPrices[index] && !isNaN(cachedPrices[index])) {
                    initialPriceVal = parseFloat(cachedPrices[index]);
                }

                stockData[code] = { price: initialPriceVal, change: 0, changePercent: 0 };

                const linkUrl = `2CB.htm?p=${code}`;
                const displayPriceText = initialPriceVal > 0 ? initialPriceVal.toFixed(2) : "載入中...";

                const cardHtml = `
                <a data-fancybox data-type="iframe" href="${linkUrl}" class="stock-card-link" id="link-${code}">
                    <div class="stock-card" id="card-${code}">
                        <div class="card-header">
                            <span class="stock-name">${name}</span>
                            <span class="stock-symbol">${code}</span>
                        </div>
                        <div class="card-body">
                            <div class="current-price flat" id="price-${code}">${displayPriceText}</div>
                        </div>
                        <div class="card-footer flat" id="footer-${code}">
                            <span id="arrow-${code}">▲</span>
                            <span id="change-${code}">0.00</span>
                            <span id="percent-${code}">(0.00%)</span>
                        </div>
                    </div>
                </a>`;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function updateUI(code, price, change, changePercent, triggerFlash = true) {
            const priceEl = document.getElementById(`price-${code}`);
            const changeEl = document.getElementById(`change-${code}`);
            const percentEl = document.getElementById(`percent-${code}`);
            const arrowEl = document.getElementById(`arrow-${code}`);
            const footerEl = document.getElementById(`footer-${code}`);
            const cardEl = document.getElementById(`card-${code}`);

            if (!priceEl) return;

            const prevPrice = stockData[code].price;
            stockData[code] = { price, change, changePercent };

            let colorClass = 'flat';
            let arrowText = ' ';

            if (change > 0) {
                colorClass = 'up';
                arrowText = '▲';
            } else if (change < 0) {
                colorClass = 'down';
                arrowText = '▼';
            }

            priceEl.textContent = price.toFixed(2);
            changeEl.textContent = Math.abs(change).toFixed(2);
            percentEl.textContent = `(${Math.abs(changePercent).toFixed(2)}%)`;
            arrowEl.textContent = arrowText;

            priceEl.className = `current-price ${colorClass}`;
            footerEl.className = `card-footer ${colorClass}`;

            if (triggerFlash && prevPrice !== price && prevPrice > 0) {
                const flashClass = change > 0 ? 'flash-up' : 'flash-down';
                cardEl.classList.add(flashClass);
                setTimeout(() => cardEl.classList.remove(flashClass), 600);
            }
        }

        async function fetchStockData(code) {
            const suffix = otcList.includes(code) ? '.TWO' : '.TW';
            const symbol = `${code}${suffix}`;
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`;
            

//alert(encodeURIComponent(url));
            try {
                const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);

//alert(response);
                if (!response.ok) throw new Error("Network error");
                
                const data = await response.json();
                const meta = data.chart.result[0].meta;
                
                const currentPrice = meta.regularMarketPrice;
                const prevClose = meta.chartPreviousClose || meta.previousClose;
                
                if (currentPrice && prevClose) {
                    const change = currentPrice - prevClose;
                    const changePercent = (change / prevClose) * 100;
                    updateUI(code, currentPrice, change, changePercent, true);
                }
            } catch (error) {
                console.error(`無法取得 ${code} 資料`, error);
            }
        }

        async function updateAllStocks() {
            const promises = stockList.map(code => fetchStockData(code));
            await Promise.all(promises);

            // 1. 將所有股票的最新股價依照股票清單順序抓出，並保留兩位小數
            let pr1 = stockList.map(code => stockData[code].price > 0 ? stockData[code].price.toFixed(2) : "0.00").join(',');

alert(pr1);
            // 2. 存入 pr2 變數與 Cookie 中
            let pr2 = pr1;
            document.cookie = `pr2=${encodeURIComponent(pr2)}; path=/; max-age=60`;

            const now = new Date();
            document.getElementById('last-update').textContent = `最後更新: ${now.toTimeString().split(' ')[0]}`;
        }

        // 初始化
        initCards();
        updateAllStocks();

        // 每 10 秒自動更新一次並重新寫入 Cookie
        setInterval(updateAllStocks, 5000);
    </script>
</body>
</html>
