<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>自動定時取得 GS 內容並存入 Cookie 與表格顯示</title>
    <style>
      body {
        margin: 0;
        padding: 20px 0;
        min-height: 100vh;
        background-color: #580000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* 中間卡片主體 */
      .card {
        background-color: #ffffff;
        border-radius: 16px;
        padding: 20px;
        width: 98%;
        max-width: 800px;
        margin: 0 auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      /* 頂部標題列與 Home 圖示 */
      .header-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        min-height: 36px;
      }

      .home-icon {
        height: 40px;
        width: auto;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
      }

      /* 狀態訊息區域 */
      .status-container p {
        max-width: 100%;
        word-break: break-all;
        margin: 8px 0;
        color: #555;
        font-size: 14px;
      }

      /* 表格樣式設定 */
      .stock-table-container {
        margin-top: 16px;
        overflow-x: auto;
      }

      table.stock-table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        font-size: 16px;
      }

      table.stock-table th {
        background-color: #f2f2f2;
        color: #333;
        padding: 10px;
        border: 1px solid #ddd;
        font-weight: bold;
      }

      table.stock-table td {
        padding: 8px;
        border: 1px solid #ddd;
      }

      table.stock-table tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      table.stock-table tr:hover {
        background-color: #f1f1f1;
      }
    </style>
</head>

<body>
  <div class="card">
    <div class="header-bar">
      <a href="index.htm" class="home-link" title="返回首頁">
        <img src="home.png" alt="首頁" class="home-icon">
      </a>
      <h2 style="font-size: 20px; color: #00F; margin: 0 0 0 10px;">股票資產群組配置</h2>
    </div>

    <!-- 狀態與更新時間容器 -->
    <div class="status-container">
      <p id="status">狀態：正在初始化...</p>
      <p id="last-update">最後更新時間：尚未更新</p>
    </div>

    <!-- 股票與股價呈現表格 -->
    <div class="stock-table-container">
      <table class="stock-table">
        <thead>
          <tr>
            <th>股票代號</th>
            <th>股價</th>
          </tr>
        </thead>
        <tbody id="stock-tbody">
          <tr>
            <td colspan="2">資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    var ss = "2002,2317,2330,2354,2610,4906,6182,6770,6781,00403A,00406A,0050,0052,00896,00919,00929,00939,00961,009816,00982A,00988A,00992A";

    // 替換為您的 Google Apps Script 網頁應用程式網址
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyjJZBpATGA5B8Abc3ubGkah3iK_iYTOb-pJt4siMVnApNuWAcpaAD2QPuAUCa3v7kz3w/exec";

    // 設定 Cookie 的輔助函數
    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            let date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
    }

    // 更新並繪製表格
    function renderStockTable(stockStr, priceStr) {
        const tbody = document.getElementById("stock-tbody");
        const stocks = stockStr.split(",");
        
        // 假設 pr2 為逗號分隔的字串，若不是則依實際資料格式切割或處理
        let prices = [];
        if (typeof priceStr === "string") {
            prices = priceStr.split(",");
        } else if (Array.isArray(priceStr)) {
            prices = priceStr;
        }

        let html = "";
        stocks.forEach((code, index) => {
            const price = prices[index] !== undefined ? prices[index].trim() : "--";
            html += `<tr>
                <td>${code.trim()}</td>
                <td>${price}</td>
            </tr>`;
        });

        tbody.innerHTML = html;
    }

    // 執行取得 C3 並存入 Cookie 與渲染表格的核心函式
    async function fetchC3AndSaveCookie() {
        const statusEl = document.getElementById("status");
        const timeEl = document.getElementById("last-update");

        try {
            // 發送 GET 請求到 GS
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();

            if (data.status === "success") {
                const c3Content = data.value;

                // 將內容存入 Cookie（有效期限 1 天）
                setCookie("pr2", c3Content, 1);
                setCookie("s", ss, 1);

                // 更新畫面狀態
                const now = new Date().toLocaleTimeString();
                statusEl.innerText = `狀態：更新成功`;
                timeEl.innerText = `最後更新時間：${now}`;
                
                // 渲染表格 (第1欄：股票代號，第2欄：股價)
                renderStockTable(ss, c3Content);

                console.log(`[${now}] Cookie "pr2" 已更新，內容:`, c3Content);
            } else {
                statusEl.innerText = "狀態：取得失敗 - " + data.message;
            }
        } catch (error) {
            console.error("發生錯誤:", error);
            statusEl.innerText = "狀態：連線錯誤，請檢查主控台 (Console)";
        }
    }

    // 1. 畫面一載入完成立即執行一次
    window.addEventListener("DOMContentLoaded", () => {
        fetchC3AndSaveCookie();

        // 2. 設定每 10 秒自動執行一次
        setInterval(fetchC3AndSaveCookie, 10000);
    });
  </script>
</body>
</html>
