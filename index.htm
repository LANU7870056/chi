    /* 立體圓形按鈕 3D 浮雕與擬物鏡面質感 */
    .sphere-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    /* 頂部高光與擬物玻璃層 */
    .sphere-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.2) 38%, rgba(0,0,0,0.65) 80%, rgba(0,0,0,0.95) 100%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .sphere-btn::after {
      content: '';
      position: absolute;
      top: 8%;
      left: 18%;
      width: 45%;
      height: 28%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 100%);
      filter: blur(1px);
      pointer-events: none;
    }

      box-shadow: 0 12px 28px rgba(255, 215, 0, 0.5), inset 0 -6px 12px rgba(0,0,0,0.85);

    .sphere-map {

      box-shadow: 0 12px 28px rgba(0, 255, 255, 0.5), inset 0 -6px 12px rgba(0,0,0,0.85);
    }
    .sphere-settings {

      box-shadow: 0 12px 28px rgba(226, 232, 240, 0.4), inset 0 -6px 12px rgba(0,0,0,0.85);

    /* Hover 與 Active 懸浮回饋 */
    .sphere-btn:hover {
      transform: translateY(-8px) scale(1.08) rotateX(10deg);
      filter: brightness(1.2);
    }

    .sphere-btn:active {
      transform: translateY(2px) scale(0.92);
      box-shadow: 0 4px 14px rgba(0,0,0,0.8);

    /* 毛玻璃卡片質感 */

    @keyframes radar-sweep {

      to { transform: rotate(360deg); }
    }

/* 預設（PC 版或其他較大螢幕） */

  <script>
    /* ===================================================
       1. 音效生成器 (Web Audio API - 無外部檔案依賴)
    =================================================== */
    class AudioSystem {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playClick() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playLaser() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playExplode() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    }
    const audioSys = new AudioSystem();


    /* ===================================================
       2. 超炫 Canvas 動態桌布引擎 (5 種主題切換)
    =================================================== */
    class WallpaperEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.theme = 'nebula'; // 主題: nebula, grid, liquid, matrix, aurora
        this.particles = [];
        this.matrixCols = [];
        this.angle = 0;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initParticles();
        this.animate();
      }

      resize() {
        if (!this.canvas.parentElement) return;
        this.canvas.width = this.canvas.parentElement.clientWidth;
        this.canvas.height = this.canvas.parentElement.clientHeight;
        this.initMatrix();
      }

      setTheme(newTheme) {
        this.theme = newTheme;
        this.initParticles();
      }

      initParticles() {
        this.particles = [];
        for (let i = 0; i < 50; i++) {
          this.particles.push({
            x: Math.random() * (this.canvas.width || 300),
            y: Math.random() * (this.canvas.height || 600),
            radius: Math.random() * 3.5 + 1,
            vx: (Math.random() - 0.5) * 1.4,
            vy: (Math.random() - 0.5) * 1.4,
            color: ['#00f3ff', '#ff007f', '#a855f7', '#00ff87', '#ffd700'][Math.floor(Math.random() * 5)]
          });
        }
      }

      initMatrix() {
        const cols = Math.floor((this.canvas.width || 300) / 16);
        this.matrixCols = Array(cols).fill(0);
      }

      animate() {
        this.angle += 0.02;
        const w = this.canvas.width;
        const h = this.canvas.height;
        if (!w || !h) {
          requestAnimationFrame(() => this.animate());
          return;
        }

        switch (this.theme) {
          case 'nebula': // 宇宙星雲粒子
            this.ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
            this.ctx.fillRect(0, 0, w, h);
            this.particles.forEach(p => {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < 0 || p.x > w) p.vx *= -1;
              if (p.y < 0 || p.y > h) p.vy *= -1;

              this.ctx.beginPath();
              this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              this.ctx.fillStyle = p.color;
              this.ctx.shadowBlur = 14;
              this.ctx.shadowColor = p.color;
              this.ctx.fill();
            });
            break;

          case 'grid': // 賽博朋克 3D 網格
            this.ctx.fillStyle = '#020617';
            this.ctx.fillRect(0, 0, w, h);
            this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.22)';
            this.ctx.lineWidth = 1;

            const gridStep = 32;
            const offsetY = (this.angle * 22) % gridStep;

            for (let x = 0; x < w; x += gridStep) {
              this.ctx.beginPath();
              this.ctx.moveTo(x, 0);
              this.ctx.lineTo(x, h);
              this.ctx.stroke();
            }
            for (let y = offsetY; y < h; y += gridStep) {
              this.ctx.beginPath();
              this.ctx.moveTo(0, y);
              this.ctx.lineTo(w, y);
              this.ctx.stroke();
            }
            break;

          case 'liquid': // 液態流光
            this.ctx.fillStyle = '#030712';
            this.ctx.fillRect(0, 0, w, h);
            const grad = this.ctx.createRadialGradient(
              w / 2 + Math.cos(this.angle) * 110,
              h / 2 + Math.sin(this.angle) * 110,
              15,
              w / 2, h / 2, w * 0.85
            );
            grad.addColorStop(0, 'rgba(255, 0, 127, 0.55)');
            grad.addColorStop(0.5, 'rgba(168, 85, 247, 0.35)');
            grad.addColorStop(1, 'rgba(0, 243, 255, 0.08)');
            this.ctx.fillStyle = grad;
            this.ctx.fillRect(0, 0, w, h);
            break;

          case 'matrix': // 數碼矩陣綠光雨
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            this.ctx.fillRect(0, 0, w, h);
            this.ctx.fillStyle = '#00ff87';
            this.ctx.font = '14px monospace';

            this.matrixCols.forEach((y, index) => {
              const char = String.fromCharCode(0x30A0 + Math.random() * 96);
              const x = index * 16;
              this.ctx.fillText(char, x, y);
              if (y > h + Math.random() * 1000) this.matrixCols[index] = 0;
              else this.matrixCols[index] = y + 16;
            });
            break;

          case 'aurora': // 深海極光
            this.ctx.fillStyle = 'rgba(2, 6, 23, 0.28)';
            this.ctx.fillRect(0, 0, w, h);
            this.ctx.beginPath();
            for (let x = 0; x < w; x += 8) {
              const y = h / 2 + Math.sin(x * 0.012 + this.angle) * 65 + Math.cos(x * 0.024) * 35;
              this.ctx.lineTo(x, y);
            }
            this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.65)';
            this.ctx.lineWidth = 4;
            this.ctx.shadowBlur = 22;
            this.ctx.shadowColor = '#00ffff';
            this.ctx.stroke();
            break;
        }

        requestAnimationFrame(() => this.animate());
      }
    }

    function createRipple(event) {
      const btn = event.currentTarget.querySelector('.sphere-btn');
      if (!btn) return;
      const ripple = document.createElement('div');
      ripple.className = 'ripple-effect text-cyan-400';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

    function toggleMusicPlay() {

      if (record) {

      if (btnIcon) {
        btnIcon.innerHTML = `<i data-lucide="${appLauncher.musicPlaying ? 'pause' : 'play'}" class="w-7 h-7 fill-current"></i>`;

      if (filter === 'pink') feed.style.filter = 'drop-shadow(0 0 12px #ff007f) hue-rotate(300deg)';
      if (filter === 'matrix') feed.style.filter = 'drop-shadow(0 0 12px #00ff87) hue-rotate(90deg)';
      if (filter === 'gold') feed.style.filter = 'drop-shadow(0 0 12px #ffd700) hue-rotate(40deg)';

      `;
      input.value = '';

      setTimeout(() => {
        box.innerHTML += `
          <div class="flex gap-2">
            <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-400 flex items-center justify-center text-emerald-300 font-bold text-xs font-orbitron shrink-0">AI</div>

              已收到指令「${userText}」，核心運算單元已完成分析！

        box.scrollTop = box.scrollHeight;
      }, 500);

    /* 迷你避障遊戲邏輯 */
    window.gameLoopId = null;
    function startGame() {
      audioSys.playClick();
      const modal = document.getElementById('game-over-modal');
      if (modal) modal.classList.add('hidden');

      const canvas = document.getElementById('game-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      let playerX = canvas.width / 2;
      let dir = 1;
      let score = 0;
      let obstacles = [];

      canvas.onclick = () => { dir *= -1; audioSys.playClick(); };

      function update() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 繪製玩家
        playerX += dir * 3.5;
        if (playerX < 12) playerX = 12;
        if (playerX > canvas.width - 12) playerX = canvas.width - 12;

        ctx.fillStyle = '#ff9900';
        ctx.beginPath();
        ctx.arc(playerX, canvas.height - 28, 9, 0, Math.PI * 2);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff9900';
        ctx.fill();

        // 生成障礙物
        if (Math.random() < 0.06) {
          obstacles.push({ x: Math.random() * canvas.width, y: 0, speed: 2.5 + Math.random() * 2.5 });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.y += obs.speed;
          ctx.fillStyle = '#ff0055';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ff0055';
          ctx.fillRect(obs.x - 7, obs.y - 7, 14, 14);

          // 碰撞檢測
          if (Math.hypot(playerX - obs.x, (canvas.height - 28) - obs.y) < 16) {
            audioSys.playExplode();
            cancelAnimationFrame(window.gameLoopId);
            window.gameLoopId = null;

            const modal = document.getElementById('game-over-modal');
            const scoreEl = document.getElementById('final-score');
            if (scoreEl) scoreEl.innerText = score;
            if (modal) {
              modal.classList.remove('hidden');
              modal.classList.add('flex');
            }
            return;
          }

          if (obs.y > canvas.height) {
            obstacles.splice(i, 1);
            score += 10;
            const scoreDisplay = document.getElementById('game-score');
            if (scoreDisplay) scoreDisplay.innerText = score;
          }
        }

        window.gameLoopId = requestAnimationFrame(update);
      }

      if (window.gameLoopId) cancelAnimationFrame(window.gameLoopId);
      update();
    }

    function toggleFullscreen() {
      audioSys.playClick();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }


    /* ===================================================
       5. 頁面初始化與時間更新
    =================================================== */
    let wallpaperEngine;

    window.onload = () => {
      // 初始化 Lucide 圖示
      lucide.createIcons();

      // 初始化 Canvas 桌布引擎
      wallpaperEngine = new WallpaperEngine('wallpaper-canvas');

      // 更新時間 Widget
      function updateTime() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');

        const statusTime = document.getElementById('status-time');
        const widgetClock = document.getElementById('widget-clock');

        if (statusTime) statusTime.innerText = `${hrs}:${mins}`;
        if (widgetClock) widgetClock.innerText = `${hrs}:${mins}:${secs}`;
      }
      setInterval(updateTime, 1000);
      updateTime();
    };
  </script>
