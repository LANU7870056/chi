<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時股價自動更新系統</title>
    <style>
     body {
            margin: 0;
            padding: 20px 0; /* 上下保留間距，不使用 flex 垂直置中避免滾動定位跑版 */
            min-height: 100vh;
            background-color: #580000; /* 背景顏色（深紅/暗紅） */
            display: block; /* 修正 : 改回預設區塊流 */
        }

        /* 2. 中間卡片主體 */
        .card {
            background-color: #ffffff;
            border-radius: 16px; /* 圓角效果 */
            padding: 8px;
            width: 98%;
            max-width: 800px;  /* 設定最大寬度 */
            margin: 0 auto;    /* 修正 : 水平置中 */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); /* 陰影提升質感 */
        }
        #statusMessage {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .loading { color: #f57c00; }
        .details {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            border: 1px solid #ddd;
            display: none;
        }

        /* 頂部標題列與 Home 圖示 */
        .header-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            min-height: 36px;
        }

 .home-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .home-icon {
            height: 50px;
            width: auto;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .home-icon:hover {
            transform: scale(1.1);
            opacity: 0.85;
        }
    </style>
</head>
<body>
 <div class="card">
 <!-- 頂部標題區域 (包含左上角 HOME 圖示) -->
        <div class="header-bar">
            <a href="index.htm" class="home-link" title="返回首頁">
                <img src="home.png" alt="首頁" class="home-icon">
            </a>
            <h2 style="font-size: 20px;color:#00F;">股票資產群組配置</h2>
        </div>

    <h2>股票資料自動抓取與寫入</h2>
    <p>系統將在背景自動每 10 秒更新一次 `text3.txt` 與即時股價</p>
    
    <div id="statusMessage" class="loading">⏳ 正在初始化並載入股價...</div>
    
    <div id="detailsBox" class="details">
        <p><strong>股票代號：</strong><span id="resSymbols"></span></p>
        <p><strong>最新股價：</strong><span id="resData"></span></p>
        <p><strong>更新時間：</strong><span id="resTimestamp"></span></p>
    </div>

    <script>

//家中/DATA4.xls  GS
        // ⚠️ 請替換成你部署 GAS 後獲得的「網頁應用程式 URL」
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzCwWNaFkCLYT_HPfwU2xD5tqJbeCfrXF1Ra16T3f7_9p1xTT1-ycBUsNdKUlxNHDe_/exec";

        async function triggerStockUpdate() {
            const statusMsg = document.getElementById("statusMessage");
            const detailsBox = document.getElementById("detailsBox");
            
            try {
                // 發送 GET 請求給 GAS doGet(e)
                let response = await fetch(WEB_APP_URL, {
                    method: "GET",
                    redirect: "follow"
                });
                
                let result = await response.json();

                if (result.error) {
                    statusMsg.className = "error";
                    statusMsg.innerText = "❌ 發生錯誤：" + result.error;
                } else {
                    // 顯示「寫入成功」
                    statusMsg.className = "success";
                    statusMsg.innerText = "🎉 自動更新成功！文字檔已更新完成。";
                    
                    // 填入詳細資訊
                    document.getElementById("resSymbols").innerText = result.symbols;
                    document.getElementById("resData").innerText = result.data;
                    document.getElementById("resTimestamp").innerText = result.timestamp;
                    detailsBox.style.display = "block";
                }
            } catch (err) {
                statusMsg.className = "error";
                statusMsg.innerText = "❌ 網路連線或解析失敗：" + err.toString();
            }
        }

        // 1. 網頁一載入完畢就立刻執行一次
        window.onload = function() {
            triggerStockUpdate();
            
            // 2. 設定每 10 秒 (10000 毫秒) 自動執行一次
            setInterval(triggerStockUpdate, 10000);
        };
    </script>

</body>
</html>
